[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "runkeel"
dynamic = ["version"]
description = "Blazing-fast, zero-daemon, agent-first (DX + AX) Rust DAG pipeline runner for the Keel Data Stack and shell/SQL workflows."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
requires-python = ">=3.9"
keywords = ["dag", "pipeline", "etl", "orchestrator", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/robertguss/runkeel"
Repository = "https://github.com/robertguss/runkeel"
Issues = "https://github.com/robertguss/runkeel/issues"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
strip = true
