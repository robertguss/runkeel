[package]
name = "runkeel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Blazing-fast, zero-daemon, agent-first (DX + AX) Rust DAG pipeline runner for the Keel Data Stack and shell/SQL workflows."
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertguss/runkeel"
homepage = "https://github.com/robertguss/runkeel"
keywords = ["dag", "pipeline", "etl", "orchestrator", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
indexmap = { version = "2.14", features = ["serde"] }
owo-colors = { version = "4.4", features = ["supports-colors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
toml = "1.2"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
